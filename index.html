<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>90 Days Winter Arc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --surface: #12151d;
      --surface-hover: #181d27;
      --border: rgba(255, 255, 255, 0.08);
      --border-active: rgba(255, 255, 255, 0.18);
      --accent: #38bdf8;
      --accent-muted: rgba(56, 189, 248, 0.12);
      --success: #10b981;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', 'Noto Sans TC', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px 60px;
    }

    .app-container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 頂部 Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .header-title p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .overall-badge {
      text-align: right;
    }

    .overall-badge .pct {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .overall-badge .label {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* 4 大核心成果快覽 */
    .goals-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    @media (max-width: 580px) {
      .goals-bar {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .goal-item {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .goal-item .title {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-weight: 600;
      text-transform: uppercase;
    }

    .goal-item .val {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 天數控制器 */
    .day-nav {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--surface-hover);
      color: var(--text);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .day-status-center {
      text-align: center;
    }

    .day-indicator {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .day-date-badge {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
      margin-top: 2px;
    }

    /* 每日焦點卡片 */
    .focus-card {
      background: linear-gradient(180deg, var(--surface) 0%, rgba(18, 21, 29, 0.6) 100%);
      border: 1px solid var(--border-active);
      border-radius: 14px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }

    .focus-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent);
    }

    .focus-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .focus-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .focus-desc {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.5;
    }

    /* 習慣清單區塊 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding: 0 4px;
    }

    .section-header h2 {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .section-header .daily-count {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .habit-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .habit-row:hover {
      background: var(--surface-hover);
      border-color: var(--border-active);
    }

    .custom-checkbox {
      width: 22px;
      height: 22px;
      border: 2px solid var(--text-dim);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .custom-checkbox svg {
      width: 13px;
      height: 13px;
      stroke: #fff;
      stroke-width: 3;
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
      transition: stroke-dashoffset 0.2s ease 0.05s;
    }

    .habit-text {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
      flex: 1;
      transition: all 0.2s;
    }

    /* 完成狀態 */
    .habit-row.checked {
      background: rgba(16, 185, 129, 0.04);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .habit-row.checked .custom-checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .habit-row.checked .custom-checkbox svg {
      stroke-dashoffset: 0;
    }

    .habit-row.checked .habit-text {
      color: var(--text-dim);
      text-decoration: line-through;
    }

    /* 覆盤日記 */
    .journal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .journal-header {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .journal-input {
      width: 100%;
      height: 80px;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .journal-input::placeholder {
      color: var(--text-dim);
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- 頂部 Header -->
  <div class="header">
    <div class="header-title">
      <h1>Winter Arc 90</h1>
      <p>閉關修煉・2026/10/02 – 2026/12/30</p>
    </div>
    <div class="overall-badge">
      <div class="pct" id="global-pct">0%</div>
      <div class="label" id="global-sub">0 / 90 DAYS</div>
    </div>
  </div>

  <!-- 4 大核心成果快覽 -->
  <div class="goals-bar">
    <div class="goal-item">
      <div class="title">體態目標</div>
      <div class="val">56kg ➔ 51kg</div>
    </div>
    <div class="goal-item">
      <div class="title">學業</div>
      <div class="val">GPA 3.9↑ / 12.5%</div>
    </div>
    <div class="goal-item">
      <div class="title">專業</div>
      <div class="val">AI 專案 & 英文</div>
    </div>
    <div class="goal-item">
      <div class="title">研究</div>
      <div class="val">畢專 & 作業研究</div>
    </div>
  </div>

  <!-- 天數切換控制器 -->
  <div class="day-nav">
    <button class="nav-btn" id="prev-btn" onclick="switchDay(-1)">← 前一天</button>
    <div class="day-status-center">
      <div class="day-indicator" id="day-label">Day 1</div>
      <div class="day-date-badge" id="day-date-label">2026/10/02 (五)</div>
    </div>
    <button class="nav-btn" id="next-btn" onclick="switchDay(1)">後一天 →</button>
  </div>

  <!-- 今日焦點里程碑 -->
  <div class="focus-card">
    <span class="focus-tag" id="focus-tag">Milestone</span>
    <h3 class="focus-title" id="focus-title">載入中...</h3>
    <p class="focus-desc" id="focus-desc">載入中...</p>
  </div>

  <!-- 習慣清單 -->
  <div class="section-header">
    <h2>Daily Habits</h2>
    <span class="daily-count" id="list-count">0 / 10 完成</span>
  </div>

  <div class="habit-list" id="habit-list"></div>

  <!-- 睡前覆盤 -->
  <div class="journal-box">
    <div class="journal-header">今日覆盤與 3 件感恩事項</div>
    <textarea 
      class="journal-input" 
      id="journal-text" 
      placeholder="寫下今天順利完成的事情，或明天的核心待辦..."
      oninput="updateJournal()"></textarea>
  </div>
</div>

<script>
  // 起始日期：2026 年 10 月 2 日
  const START_DATE = new Date(2026, 9, 2);
  const totalDays = 90;

  const focusData = {
    1: { tag: "Day 1 拆解", title: "英文具體化：定下 90 天驗收標準", desc: "決定 90 天後的英文指標（如：報名多益/檢定、每天聽 15 分鐘全英文 Podcast 並做一句總結、或精讀 1 篇英文技術論文）。" },
    2: { tag: "Day 2 拆解", title: "AI 技能拆解：鎖定實作路徑", desc: "決定要完成的 AI 專案或課程（例如：實作一個串接 API 的應用、微調模型、或完整刷完一門核心深度學習課程）。" },
    3: { tag: "Day 3 拆解", title: "畢業專題：定出第一個月 Milestone", desc: "將畢專切分為三個 30 天區間。明確寫下本週要產出的文獻摘要或 Baseline 程式碼。" },
    4: { tag: "Day 4 拆解", title: "作業研究（OR）：盤點薄弱觀念", desc: "列出之前卡關的章節（LP、Simplex、Duality 等），固定排入每週兩次 45 分鐘的重讀時段。" },
    5: { tag: "Day 5 拆解", title: "排程固化：鎖定每週課表", desc: "檢視前幾天執行情況，把游泳（2 次）、重訓（2 次）的固定星期與時段確定下來。" }
  };

  const habits = [
    { id: "workout", text: "運動訓練（游泳 1500m/40min 或 重訓）" },
    { id: "water", text: "喝足 3 瓶水（約 2000–2500ml）" },
    { id: "no_sugar", text: "戒含糖手搖飲（無糖茶 / 黑咖啡 / 水）" },
    { id: "clean_diet", text: "戒炸物與超加工零食（原型食物為主）" },
    { id: "deep_work", text: "自主進修 / 專題 / 作業研究專注 30–45 分鐘" },
    { id: "reading", text: "閱讀 10–15 頁書" },
    { id: "social_limit", text: "IG + Threads 每日控制在 30 分鐘以內" },
    { id: "no_phone_bed", text: "睡前 30 分鐘不用手機 ➔ 看書或拉筋" },
    { id: "sleep", text: "12:00 就寢 - 07:00 起床（睡足 7 小時）" },
    { id: "review", text: "起/睡前寫下 3 件感恩與進度覆盤" }
  ];

  function getDayDateString(dayNumber) {
    const d = new Date(START_DATE);
    d.setDate(d.getDate() + (dayNumber - 1));
    const weekdays = ["日", "一", "二", "三", "四", "五", "六"];
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const date = String(d.getDate()).padStart(2, '0');
    const w = weekdays[d.getDay()];
    return `${y}/${m}/${date} (${w})`;
  }

  function getTodayDayNumber() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diffTime = today - START_DATE;
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
    if (diffDays < 1) return 1;
    if (diffDays > totalDays) return totalDays;
    return diffDays;
  }

  let currentDay = getTodayDayNumber();

  function getStore() {
    return JSON.parse(localStorage.getItem("winter_arc_store") || "{}");
  }

  function setStore(data) {
    localStorage.setItem("winter_arc_store", JSON.stringify(data));
  }

  function render() {
    const store = getStore();
    const dayData = store[currentDay] || { checks: {}, note: "" };

    document.getElementById("day-label").innerText = `Day ${currentDay}`;
    document.getElementById("day-date-label").innerText = getDayDateString(currentDay);
    document.getElementById("prev-btn").disabled = (currentDay === 1);
    document.getElementById("next-btn").disabled = (currentDay === totalDays);

    const focus = focusData[currentDay] || {
      tag: "Focus",
      title: `Day ${currentDay} 深度修煉`,
      desc: "專注落實核心習慣，推進 45 分鐘專業領域（畢專/AI/作業研究/英文）。"
    };
    document.getElementById("focus-tag").innerText = focus.tag;
    document.getElementById("focus-title").innerText = focus.title;
    document.getElementById("focus-desc").innerText = focus.desc;

    const list = document.getElementById("habit-list");
    list.innerHTML = "";
    let doneCount = 0;

    habits.forEach(h => {
      const isDone = !!(dayData.checks && dayData.checks[h.id]);
      if (isDone) doneCount++;

      const row = document.createElement("div");
      row.className = `habit-row ${isDone ? 'checked' : ''}`;
      row.onclick = () => toggleCheck(h.id);

      row.innerHTML = `
        <div class="custom-checkbox">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <span class="habit-text">${h.text}</span>
      `;
      list.appendChild(row);
    });

    document.getElementById("list-count").innerText = `${doneCount} / ${habits.length} 完成`;
    document.getElementById("journal-text").value = dayData.note || "";

    calcGlobalStats();
  }

  function toggleCheck(id) {
    const store = getStore();
    if (!store[currentDay]) store[currentDay] = { checks: {}, note: "" };
    if (!store[currentDay].checks) store[currentDay].checks = {};

    store[currentDay].checks[id] = !store[currentDay].checks[id];
    setStore(store);
    render();
  }

  function updateJournal() {
    const store = getStore();
    if (!store[currentDay]) store[currentDay] = { checks: {}, note: "" };
    store[currentDay].note = document.getElementById("journal-text").value;
    setStore(store);
  }

  function switchDay(delta) {
    const target = currentDay + delta;
    if (target >= 1 && target <= totalDays) {
      currentDay = target;
      render();
    }
  }

  function calcGlobalStats() {
    const store = getStore();
    let completedDays = 0;

    for (let d = 1; d <= totalDays; d++) {
      if (store[d] && store[d].checks) {
        const c = Object.values(store[d].checks).filter(Boolean).length;
        if (c >= 7) completedDays++;
      }
    }

    const pct = Math.round((completedDays / totalDays) * 100);
    document.getElementById("global-pct").innerText = `${pct}%`;
    document.getElementById("global-sub").innerText = `${completedDays} / ${totalDays} DAYS`;
  }

  window.onload = render;
</script>

</body>
</html>
